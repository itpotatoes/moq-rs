# Skew experiment — MoQ spike (2-track pub/sub roundtrip over one QUIC connection via relay)
[package]
name = "skew-moq-spike"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "skew_moq"
path = "src/lib.rs"

[[bin]]
name = "skew-moq-spike"
path = "src/main.rs"

[[bin]]
name = "moq_sender"
path = "src/bin/moq_sender.rs"

[[bin]]
name = "moq_receiver"
path = "src/bin/moq_receiver.rs"

[dependencies]
moq-transport = { path = "../moq-transport", version = "0.15" }
moq-native-ietf = { path = "../moq-native-ietf", version = "0.9" }
web-transport = { workspace = true }

bytes = "1"
url = "2"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { version = "1", features = ["backtrace"] }
